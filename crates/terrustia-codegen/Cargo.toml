# The data-table generator, in Rust rather than Python.
#
# `terrustia-proto` ships a handful of tables extracted from the game — which tiles hurt, what each
# NPC drops, and so on. The extraction used to be a directory of Python scripts (`tools/gen_*.py`);
# this crate replaces them, so regenerating a table needs only the Rust toolchain the rest of the
# project already needs, and no second language in the build story. Each table is its own module
# with a `generate(decompiled) -> String`; `main` runs one or all of them and writes the result,
# and `just regen` runs this then `cargo fmt` exactly as the Python recipe did.
#
# Not in the workspace's own dependency graph on purpose — it is a developer tool, run by hand
# against a decompiled tree that never ships, so nothing in `crates/terrustia*` depends on it and an
# ordinary build never compiles it.
[package]
name = "terrustia-codegen"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
# Which binary a bare `cargo run -p terrustia-codegen -- <table>` means. Without it, every line of
# `just regen` exited 101 with "could not determine which binary to run" from the day the
# `deadwrite` lint was added as a second binary (2026-08-31) until this was noticed - so the one
# documented way to change a generated table did not run at all, while rule 7 went on telling
# people it was the only way. `deadwrite`'s own recipe names `--bin deadwrite` and is unaffected.
default-run = "codegen"

[[bin]]
name = "codegen"
path = "src/main.rs"

# The dead-write lint (`just check-dead-writes`). It lives here because this crate is already
# outside the default build set, so its parser dependency costs an ordinary `cargo build` nothing;
# putting it in the server crate would have added `syn` to every build of the server.
[[bin]]
name = "deadwrite"
path = "src/bin/deadwrite.rs"

[dependencies]
regex = "1"
# Only for the `deadwrite` lint. A field write and a field read have to be told apart *structurally*
# (`npc.foo = 1` from `if npc.foo`), and the whole reason this lane exists is that a regex slice
# over source text reads past what it thinks it is matching. `syn` is already in this workspace's
# lockfile as a proc-macro dependency, and this crate never enters an ordinary build.
syn = { version = "2", features = ["full", "visit"] }
# `span-locations` is what turns a parsed node back into a `file:line` for the report; without it a
# finding is a field name with nowhere to go and look.
proc-macro2 = { version = "1", features = ["span-locations"] }
# Only for town_names: the localisation file is JSON with trailing commas (stripped before
# parsing, same as the Python original). "preserve_order" keeps object keys in file order, since
# a category's name list is read out as `.values()` in that order, not sorted.
serde_json = { version = "1.0", features = ["preserve_order"] }
